name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_CONFIGURATION: Release
  TESTS_LOCATION: tests/xUnitTests
  PROJECT_NAME: Billio.sln
  # Master's coverage minus 1 point, rounded down to one decimal (Infrastructure left out). A branch that
  # raises coverage raises them before its PR is opened, and sets them from the PR's CI gate line if that
  # differs; never below master's (CLAUDE.md, Conventions).
  COVERAGE_MIN_LINE: 91.6
  COVERAGE_MIN_BRANCH: 85.0

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build
        run: dotnet build ${{ env.PROJECT_NAME }} --configuration ${{ env.DOTNET_CONFIGURATION }}

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Run tests
        run: |
          dotnet test --configuration ${{ env.DOTNET_CONFIGURATION }} ${{ env.TESTS_LOCATION }} --collect "XPlat Code Coverage" --results-directory TestResults
      - name: Coverage report
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.5.12
          reportgenerator -reports:"TestResults/*/coverage.cobertura.xml" -targetdir:coveragereport \
            "-reporttypes:Html;MarkdownSummaryGithub;JsonSummary" "-assemblyfilters:-Infrastructure"
          grep -v 'reportgenerator.io/pro' coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coveragereport
            TestResults/*/coverage.cobertura.xml
      - name: Coverage gate
        run: |
          # Numbers only: awk compares a null or missing value as text, and 'null' >= '91.6' is true
          line=$(jq -e '.summary.linecoverage | numbers' coveragereport/Summary.json) \
            || { echo "::error::Summary.json has no line coverage number"; exit 1; }
          branch=$(jq -e '.summary.branchcoverage | numbers' coveragereport/Summary.json) \
            || { echo "::error::Summary.json has no branch coverage number"; exit 1; }
          echo "Line $line% (minimum $COVERAGE_MIN_LINE%), branch $branch% (minimum $COVERAGE_MIN_BRANCH%)"
          awk -v l="$line" -v b="$branch" -v ml="$COVERAGE_MIN_LINE" -v mb="$COVERAGE_MIN_BRANCH" \
            'BEGIN { exit !(l >= ml && b >= mb) }' || { echo "::error::Coverage is below the minimum"; exit 1; }

  integration-tests:
    name: Integration tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Biller repository
        uses: actions/checkout@v4

      - name: Clone BillioIntegrationTest repository
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          if git ls-remote --exit-code --heads https://github.com/aldisadom/BillioIntegrationTest.git "$BRANCH" >/dev/null 2>&1; then
            echo "Branch '$BRANCH' found in BillioIntegrationTest, cloning it"
            git clone --branch "$BRANCH" --single-branch https://github.com/aldisadom/BillioIntegrationTest.git ./BillioIntegrationTest
          else
            echo "Branch '$BRANCH' not found in BillioIntegrationTest, cloning default branch"
            git clone https://github.com/aldisadom/BillioIntegrationTest.git ./BillioIntegrationTest
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Start services
        run: docker compose -f docker-compose.yml up -d --build

      - name: Wait for API to be ready
        run: |
          echo "Waiting for Biller API..."
          for i in $(seq 1 5); do
            if curl -sf http://localhost:8090/health 2>/dev/null; then
              echo "API is up!"
              exit 0
            fi
            echo "Attempt $i/5 - sleeping 10s..."
            sleep 10
          done
          echo "ERROR: API did not become ready. Dumping logs:"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
          exit 1

      - name: Run integration tests
        working-directory: ./BillioIntegrationTest
        run: |
          dotnet restore BillioIntegrationTest.sln
          dotnet build BillioIntegrationTest.sln --configuration ${{ env.DOTNET_CONFIGURATION }} --no-restore
          # A BillioIntegrationTest checkout whose global.json opts in to the Microsoft.Testing.Platform
          # runner (TUnit 1.x, BIL-94) takes --report-trx; an older one still takes VSTest's --logger.
          if grep -q '"Microsoft.Testing.Platform"' global.json 2>/dev/null; then
            TRX="--report-trx --report-trx-filename integration-results.trx"
          else
            TRX="--logger trx;LogFileName=integration-results.trx"
          fi
          dotnet test BillioIntegrationTest.sln --configuration ${{ env.DOTNET_CONFIGURATION }} --no-build \
            $TRX --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ./BillioIntegrationTest/TestResults/*.trx

      - name: Stop and clean up services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v