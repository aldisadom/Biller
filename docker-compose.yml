version: '3.4'

services:
  db:
    image: postgres:16
    container_name: "billio-db"
    restart: always
    environment:
      POSTGRES_DB: Data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
     - "5437:5432"
    volumes:
     - postgres_data:/var/lib/postgresql/data
    # Over TCP: on a new volume the image's first-time init server listens on the unix socket only,
    # and Liquibase connects over TCP
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d Data"]
      interval: 2s
      timeout: 5s
      retries: 30
      # First-time init of a new volume doesn't count against the retries
      start_period: 60s

  pgadmin:
    image: dpage/pgadmin4:9.7.0
    container_name: "billio-pgadmin4"
    restart: always
    depends_on: 
      - db
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: postgres@postgres.com
      PGADMIN_DEFAULT_PASSWORD: postgres
      PGADMIN_CONFIG_SERVER_MODE: 'False'

  liquibase:
    image: liquibase/liquibase:4.26.0
    container_name: "billio-liquibase"
    # Waits until Postgres accepts connections, not just until its container started
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/liquibase/migrations
    command:
      - --changeLogFile=/migrations/dbChangeLog.yaml     
      - --url=jdbc:postgresql://db:5432/Data
      - --username=postgres
      - --password=postgres
      - update
    ports:
      - "8085:8080"

  webapi:
    image: ${DOCKER_REGISTRY-}webapi    
    container_name: "billio-webapi"  
    restart: unless-stopped
    # Starts only after every migration ran: the code needs the schema it was written for. When a
    # migration fails, `up` stops with an error and doesn't start this API.
    depends_on:
      db:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
    environment:
      # Prod for make run/update; CI sets BILLER_ENVIRONMENT=Dev for the tests
      - ASPNETCORE_ENVIRONMENT=${BILLER_ENVIRONMENT:-Prod}
      - ASPNETCORE_HTTP_PORTS=8070
      - ASPNETCORE_HTTPS_PORTS=
    volumes:
      - ./Fonts:/Fonts
    build:
      context: .
      dockerfile: src/WebAPI/Dockerfile
    ports:
     - "8090:8070"
    networks:
     - default
     - billio_network

volumes:
  postgres_data:

networks:
  default: {}
  billio_network:
    name: billio_network